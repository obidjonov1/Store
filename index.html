<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #f4f5f7);
    color: var(--tg-theme-text-color, #222);
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { font-size: 12px; color: #999; text-align: center; margin-bottom: 16px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    background: #eef1f5; color: #666; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: #4f7cff; color: #fff; font-weight: 600; }

  .addProductBtn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2ecc71;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 16px;
  }

  .productCard {
    background: var(--tg-theme-secondary-bg-color, #fff);
    border-radius: 14px; overflow: hidden; margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .productCard img {
    width: 100%; height: 180px; object-fit: cover; display: block; background: #eee;
  }
  .productBody { padding: 14px; }
  .productName { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .productDesc { font-size: 13px; color: #888; margin-bottom: 8px; line-height: 1.4; }
  .productPrice { font-size: 17px; font-weight: 700; color: #4f7cff; margin-bottom: 10px; }
  .orderBtn {
    width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4f7cff;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .adminRow { display: flex; gap: 8px; margin-top: 8px; }
  .adminRow button {
    flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: none;
    font-size: 12px; cursor: pointer; color: #666;
  }
  .adminRow button.del { color: #e74c3c; border-color: #f3c8c4; }

  .empty { text-align: center; color: #aaa; font-size: 13px; padding: 30px 0; }
  .status { font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; font-weight: 600; }
  .status.ok { color: #2ecc71; }
  .status.fail { color: #e74c3c; }
  .status.info { color: #999; }

  .claimBox {
    background: #fff7e6; border: 1px solid #ffe1a8; border-radius: 12px;
    padding: 14px; text-align: center; margin-bottom: 16px; font-size: 13px; color: #8a6100;
  }
  .claimBox button {
    margin-top: 10px; padding: 10px 16px; border: none; border-radius: 8px;
    background: #b5790a; color: #fff; font-weight: 600; cursor: pointer;
  }

  .orderRow {
    background: var(--tg-theme-secondary-bg-color, #fff);
    border-radius: 12px; padding: 14px; margin-bottom: 10px; font-size: 13px;
  }
  .orderRow .top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
  .orderRow .line { color: #666; margin-bottom: 2px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlayCard {
    background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px;
    max-height: 85vh; overflow-y: auto;
  }
  .overlayCard h2 { font-size: 16px; margin: 0 0 14px; text-align: center; }
  .formRow { margin-bottom: 12px; }
  .formRow label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .formRow input, .formRow textarea {
    width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 16px; background: #f7f8fa; color: #222; font-family: inherit;
  }
  .formRow textarea { resize: vertical; min-height: 60px; }
  .overlayBtn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; background: #4f7cff;
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }
  .overlayBtn.danger { background: #e74c3c; }
  .overlayBtnSecondary {
    width: 100%; padding: 10px; border: none; background: none; color: #999;
    font-size: 13px; cursor: pointer; margin-top: 8px;
  }

  /* ===== Telegram tungi (dark) rejimi ===== */
  body.tg-dark .sub,
  body.tg-dark .productDesc,
  body.tg-dark .empty,
  body.tg-dark .status.info,
  body.tg-dark .formRow label,
  body.tg-dark .overlayBtnSecondary,
  body.tg-dark .orderRow .line {
    color: var(--tg-theme-hint-color, #aaa);
  }
  body.tg-dark .tabs button {
    background: rgba(255,255,255,0.08);
    color: var(--tg-theme-hint-color, #aaa);
  }
  body.tg-dark .productName,
  body.tg-dark .overlayCard h2,
  body.tg-dark .orderRow .top {
    color: var(--tg-theme-text-color, #fff);
  }
  body.tg-dark .adminRow button {
    border-color: rgba(255,255,255,0.2);
    color: var(--tg-theme-hint-color, #aaa);
  }
  body.tg-dark .overlayCard {
    background: var(--tg-theme-secondary-bg-color, #222);
  }
  body.tg-dark .formRow input, body.tg-dark .formRow textarea {
    background: rgba(255,255,255,0.08);
    color: var(--tg-theme-text-color, #fff);
    border-color: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛍 Do'kon</h1>
  <div class="sub" id="subLine">Yuklanmoqda...</div>

  <div id="claimSection"></div>

  <div class="tabs" id="tabsRow" style="display:none;">
    <button id="tabProducts" class="active" onclick="showView('products')">Mahsulotlar</button>
    <button id="tabOrders" onclick="showView('orders')">📋 Buyurtmalar</button>
  </div>

  <button class="addProductBtn" id="addProductBtn" style="display:none;" onclick="openProductForm()">➕ Mahsulot qo'shish</button>

  <div id="productsView"></div>
  <div id="ordersView" style="display:none;"></div>

  <div class="status" id="statusMsg"></div>
</div>

<div class="overlay hidden" id="productOverlay">
  <div class="overlayCard">
    <h2 id="productFormTitle">Yangi mahsulot</h2>
    <div class="formRow">
      <label>Nomi</label>
      <input type="text" id="pName" placeholder="Masalan: Erkaklar kurtkasi">
    </div>
    <div class="formRow">
      <label>Narxi</label>
      <input type="text" id="pPrice" placeholder="Masalan: 350,000 so'm">
    </div>
    <div class="formRow">
      <label>Tavsif (ixtiyoriy)</label>
      <textarea id="pDesc" placeholder="Qisqacha ma'lumot"></textarea>
    </div>
    <div class="formRow">
      <label>Rasm havolasi (ixtiyoriy)</label>
      <input type="text" id="pImage" placeholder="https://...">
    </div>
    <button class="overlayBtn" onclick="saveProduct()">Saqlash</button>
    <button class="overlayBtn danger" id="deleteProductBtn" onclick="deleteProduct()" style="display:none;">O'chirish</button>
    <button class="overlayBtnSecondary" onclick="closeProductForm()">Bekor qilish</button>
  </div>
</div>

<div class="overlay hidden" id="orderOverlay">
  <div class="overlayCard">
    <h2>Buyurtma berish</h2>
    <p style="font-size:13px; color:#888; text-align:center; margin-bottom:14px;" id="orderProductLabel"></p>
    <div class="formRow">
      <label>Ismingiz</label>
      <input type="text" id="oName" placeholder="Ismingiz">
    </div>
    <div class="formRow">
      <label>Telefon raqamingiz</label>
      <input type="tel" id="oPhone" placeholder="+998 90 123 45 67">
    </div>
    <div class="formRow">
      <label>Manzil</label>
      <textarea id="oAddress" placeholder="Yetkazib berish manzili"></textarea>
    </div>
    <button class="overlayBtn" onclick="submitOrder()">Buyurtma berish</button>
    <button class="overlayBtnSecondary" onclick="closeOrderForm()">Bekor qilish</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

function applyTelegramTheme() {
  if (tg && tg.colorScheme === "dark") document.body.classList.add("tg-dark");
  else document.body.classList.remove("tg-dark");
}
applyTelegramTheme();
if (tg && tg.onEvent) tg.onEvent("themeChanged", applyTelegramTheme);

let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const tag = event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const now = Date.now();
  if (now - lastTouchEnd <= 350) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', function (event) { event.preventDefault(); });

// ====== FIREBASE (mavjud "Harajatlar" loyihasi) ======
const firebaseConfig = {
  apiKey: "AIzaSyALoMnUIFP1r5Ol0XD15jVrpKDmCjbk5A0",
  authDomain: "harajatlar-2c00d.firebaseapp.com",
  databaseURL: "https://harajatlar-2c00d-default-rtdb.firebaseio.com",
  projectId: "harajatlar-2c00d",
  storageBucket: "harajatlar-2c00d.firebasestorage.app",
  messagingSenderId: "905274239250",
  appId: "1:905274239250:web:d2c430116321d27ebbebcb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const shopRef = db.ref("shop");
const productsRef = shopRef.child("products");
const ordersRef = shopRef.child("orders");
const adminIdRef = shopRef.child("adminId");

// ====== TELEGRAM BOT (buyurtma xabarlarini yuborish uchun) ======
// BotFather'dan olingan yangi bot tokeni shu yerga qo'yiladi.
const BOT_TOKEN = "8042343551:AAHIMer_WaT68alPha8BRheFNsvPhXSK9JY";
// =======================================================

function showMsg(text) {
  if (tg && tg.showAlert) tg.showAlert(text);
  else alert(text);
}
function setStatus(msg, cls) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "status" + (cls ? " " + cls : "");
}

const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const myId = tgUser ? String(tgUser.id) : null;
const myName = tgUser ? (tgUser.first_name || "Foydalanuvchi") : "Mehmon";

let products = {};
let orders = {};
let adminId = null;
let isAdmin = false;
let editingProductKey = null;
let orderingProductKey = null;

document.getElementById("subLine").textContent = "Siz: " + myName;

adminIdRef.on("value", (snap) => {
  adminId = snap.val() || null;
  isAdmin = !!(myId && adminId && myId === adminId);
  renderClaimSection();
  document.getElementById("tabsRow").style.display = isAdmin ? "flex" : "none";
  document.getElementById("addProductBtn").style.display = isAdmin ? "block" : "none";
  if (!isAdmin) showView("products");
});

function renderClaimSection() {
  const el = document.getElementById("claimSection");
  if (adminId === null && myId) {
    el.innerHTML = '<div class="claimBox">Bu do\'kon uchun hali admin belgilanmagan.<br>Agar bu sizning do\'koningiz bo\'lsa:<br><button onclick="claimAdmin()">Men adminman</button></div>';
  } else {
    el.innerHTML = "";
  }
}

async function claimAdmin() {
  if (!myId) {
    showMsg("Telegram orqali ochilmagani uchun aniqlab bo'lmadi.");
    return;
  }
  try {
    await adminIdRef.set(myId);
  } catch (e) {
    showMsg("Xatolik: " + e.message);
  }
}

productsRef.on("value", (snap) => {
  products = snap.val() || {};
  renderProducts();
});

ordersRef.on("value", (snap) => {
  orders = snap.val() || {};
  renderOrders();
});

function renderProducts() {
  const el = document.getElementById("productsView");
  const keys = Object.keys(products);
  if (keys.length === 0) {
    el.innerHTML = '<div class="empty">Hali mahsulot qo\'shilmagan</div>';
    return;
  }
  keys.sort((a, b) => (products[b].ts || 0) - (products[a].ts || 0));
  el.innerHTML = "";
  keys.forEach(key => {
    const p = products[key];
    const card = document.createElement("div");
    card.className = "productCard";
    let html = "";
    if (p.image) html += '<img src="' + p.image + '" onerror="this.style.display=\'none\'">';
    html += '<div class="productBody">';
    html += '<div class="productName">' + p.name + '</div>';
    if (p.desc) html += '<div class="productDesc">' + p.desc + '</div>';
    html += '<div class="productPrice">' + p.price + '</div>';
    html += '<button class="orderBtn" onclick="openOrderForm(\'' + key + '\')">🛒 Buyurtma berish</button>';
    if (isAdmin) {
      html += '<div class="adminRow"><button onclick="openProductForm(\'' + key + '\')">✏️ Tahrirlash</button></div>';
    }
    html += '</div>';
    card.innerHTML = html;
    el.appendChild(card);
  });
}

function renderOrders() {
  const el = document.getElementById("ordersView");
  const keys = Object.keys(orders);
  if (keys.length === 0) {
    el.innerHTML = '<div class="empty">Hali buyurtma yo\'q</div>';
    return;
  }
  keys.sort((a, b) => (orders[b].ts || 0) - (orders[a].ts || 0));
  el.innerHTML = "";
  keys.forEach(key => {
    const o = orders[key];
    const row = document.createElement("div");
    row.className = "orderRow";
    const date = o.ts ? new Date(o.ts).toLocaleString("uz-UZ") : "";
    row.innerHTML =
      '<div class="top"><span>' + o.productName + '</span><span>' + o.price + '</span></div>' +
      '<div class="line">👤 ' + o.customerName + '</div>' +
      '<div class="line">📞 ' + o.phone + '</div>' +
      '<div class="line">📍 ' + o.address + '</div>' +
      '<div class="line">🕒 ' + date + '</div>';
    el.appendChild(row);
  });
}

function showView(v) {
  document.getElementById("productsView").style.display = v === "products" ? "block" : "none";
  document.getElementById("ordersView").style.display = v === "orders" ? "block" : "none";
  document.getElementById("addProductBtn").style.display = (isAdmin && v === "products") ? "block" : "none";
  if (isAdmin) {
    document.getElementById("tabProducts").classList.toggle("active", v === "products");
    document.getElementById("tabOrders").classList.toggle("active", v === "orders");
  }
}

// ====== MAHSULOT QO'SHISH / TAHRIRLASH ======

function openProductForm(key) {
  editingProductKey = key || null;
  const overlay = document.getElementById("productOverlay");
  const title = document.getElementById("productFormTitle");
  const delBtn = document.getElementById("deleteProductBtn");

  if (editingProductKey) {
    const p = products[editingProductKey];
    title.textContent = "Mahsulotni tahrirlash";
    document.getElementById("pName").value = p.name || "";
    document.getElementById("pPrice").value = p.price || "";
    document.getElementById("pDesc").value = p.desc || "";
    document.getElementById("pImage").value = p.image || "";
    delBtn.style.display = "block";
  } else {
    title.textContent = "Yangi mahsulot";
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pDesc").value = "";
    document.getElementById("pImage").value = "";
    delBtn.style.display = "none";
  }
  overlay.classList.remove("hidden");
}

function closeProductForm() {
  document.getElementById("productOverlay").classList.add("hidden");
  editingProductKey = null;
}

async function saveProduct() {
  const name = document.getElementById("pName").value.trim();
  const price = document.getElementById("pPrice").value.trim();
  const desc = document.getElementById("pDesc").value.trim();
  const image = document.getElementById("pImage").value.trim();

  if (!name || !price) {
    showMsg("Iltimos, nomi va narxini kiriting.");
    return;
  }

  setStatus("Saqlanmoqda...", "");
  try {
    if (editingProductKey) {
      await productsRef.child(editingProductKey).update({ name, price, desc, image });
    } else {
      await productsRef.push({ name, price, desc, image, ts: Date.now() });
    }
    setStatus("Saqlandi ✓", "ok");
    setTimeout(() => setStatus("", ""), 1200);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
  closeProductForm();
}

async function deleteProduct() {
  if (!editingProductKey) return;
  try {
    await productsRef.child(editingProductKey).remove();
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
  closeProductForm();
}

// ====== BUYURTMA BERISH ======

function openOrderForm(key) {
  orderingProductKey = key;
  const p = products[key];
  document.getElementById("orderProductLabel").textContent = p.name + " — " + p.price;
  document.getElementById("oName").value = tgUser ? (tgUser.first_name || "") : "";
  document.getElementById("oPhone").value = "";
  document.getElementById("oAddress").value = "";
  document.getElementById("orderOverlay").classList.remove("hidden");
}

function closeOrderForm() {
  document.getElementById("orderOverlay").classList.add("hidden");
  orderingProductKey = null;
}

async function submitOrder() {
  const name = document.getElementById("oName").value.trim();
  const phone = document.getElementById("oPhone").value.trim();
  const address = document.getElementById("oAddress").value.trim();

  if (!name || !phone || !address) {
    showMsg("Iltimos, barcha maydonlarni to'ldiring.");
    return;
  }

  const p = products[orderingProductKey];
  const order = {
    productName: p.name,
    price: p.price,
    customerName: name,
    phone: phone,
    address: address,
    ts: Date.now()
  };

  setStatus("Yuborilmoqda...", "");
  try {
    await ordersRef.push(order);
    await notifyAdmin(order);
    setStatus("Buyurtma qabul qilindi ✓", "ok");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    setTimeout(() => setStatus("", ""), 2000);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
  closeOrderForm();
}

async function notifyAdmin(order) {
  if (!adminId || !BOT_TOKEN || BOT_TOKEN === "PUT_YOUR_BOT_TOKEN_HERE") return;
  const text =
    "🛒 Yangi buyurtma!\n\n" +
    "Mahsulot: " + order.productName + "\n" +
    "Narxi: " + order.price + "\n" +
    "Xaridor: " + order.customerName + "\n" +
    "Telefon: " + order.phone + "\n" +
    "Manzil: " + order.address;

  try {
    await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: adminId, text: text })
    });
  } catch (e) {
    // Xabar yuborilmasa ham, buyurtma Firebase'da saqlanib qoladi
  }
}
</script>
</body>
</html>
